name: Scrape IPOs, Dividends, and Floor Sheets

on:
  push:
    branches:
      - main
  schedule:
    # Run once daily Mon-Fri at 5:00 PM NPT (11:15 AM UTC)
    - cron: '15 11 * * 1-5'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: yonepse-data-scrapers
  cancel-in-progress: false

jobs:
  scrape_ipo:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install -r scripts/nepse-scraper/requirements.txt
        pip install PyYAML

    - name: Run IPO Scraper
      run: |
        mkdir -p data
        python scripts/nepse-scraper/official_scraper.py --financials --profiles --ltp-history skip --skip-market --floor-sheet
        python scripts/nepse-scraper/upcoming_ipo_scraper.py
        python scripts/nepse-scraper/proposed_dividend_scraper.py --mode latest
        python scripts/nepse-scraper/sectors.py
        python scripts/sharehub_broker_scraper.py
        python scripts/merge_brokers.py

    - name: Run project guardrails
      run: |
        node --check assets/js/script.js
        node --check assets/js/data.js
        python -m compileall scripts
        python scripts/validate_project.py

    - name: Commit and push changes
      run: |
        git config --global user.name "YONEPSE Ipo Bot"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git pull --rebase --autostash
        git add data/company data/ipo data/proposed_dividend data/floor_sheet data/market/omf.json data/notify data/other/brokers.json
        git commit -m "Update IPO, Dividends, and Floor Sheet: $(date)" || echo "No changes to commit"
        git push
